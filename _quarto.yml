format:
  html:
    theme: [sandstone, assets/styles/_variables.scss]
    css: assets/styles/styles.css
    mainfont: "Manrope"
    monofont: "JetBrains Mono"
    
    # UX & Comportamiento
    toc: true
    toc-title: On this page
    fixed-header: true
    smooth-scroll: true
    anchor-sections: true
    link-external-icon: true
    link-external-newwindow: true
    google-scholar: true
    
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    code-fold: show
    code-tools: true
    lightbox: true
    html-math-method: mathjax
    citation-hover: true

    # Configuración de Comentarios
    comments:
      giscus:
        repo: MaykolMedrano/maykolmedrano.github.io
        repo-id: "R_kgDOQ296zQ"
        category: "General"
        category-id: "DIC_kwDOQ296zc4C0x47"
        mapping: pathname
        reactions-enabled: true
        input-position: top
        theme:
          light: light
          dark: dark
        loading: lazy

    # Header
    include-in-header:
      - file: assets/metadata/google-structured-data.html
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="dns-prefetch" href="https://www.googletagmanager.com">
          <link rel="dns-prefetch" href="https://www.google-analytics.com">

          <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

          <meta name="author" content="Maykol Medrano">
          <meta name="keywords" content="Maykol Medrano, Policy Data Scientist, Applied Economist, Causal Inference, Machine Learning, Peru, Chile, ENAHO, Python, Stata, Econometrics, Data Science">
          
          <!-- Google Search Console -->
          <meta name="google-site-verification" content="AijWOm3glVo95-yDVijX-PzLUXraLxOF6SAo86fVE-c" />

          <meta name="robots" content="index, follow">
          <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">

          <meta name="theme-color" content="#325d88" media="(prefers-color-scheme: light)">
          <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <meta name="apple-mobile-web-app-title" content="Maykol Medrano">
          <meta name="mobile-web-app-capable" content="yes">

          <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
          <link rel="apple-touch-icon" sizes="180x180" href="assets/img/profile.png">

          <link rel="manifest" href="manifest.json">

          <meta http-equiv="X-UA-Compatible" content="IE=edge">
          <meta http-equiv="X-Content-Type-Options" content="nosniff">
          <meta name="referrer" content="strict-origin-when-cross-origin">

          <link rel="preload" as="image" href="assets/img/profile.png" type="image/png">

          <meta name="citation_author" content="Medrano, Maykol">
          <meta name="citation_title" content="Maykol Medrano - Policy Data Scientist">
          <meta name="DC.creator" content="Maykol Medrano">
          <meta name="DC.language" content="en">

    include-after-body:
      - text: |

          <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
            <span class="theme-icon">🌙</span>
          </button>

          <script>
            (function() {
              // Optimized Scroll Handler (Progress Bar) - Throttled for performance
              let scrollTimeout;
              window.addEventListener('scroll', () => {
                if (scrollTimeout) return;
                scrollTimeout = setTimeout(() => {
                  const scrollPercent = (window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 100;
                  const header = document.querySelector('header');
                  if (header) {
                    header.style.setProperty('--scroll-width', scrollPercent + '%');
                  }
                  scrollTimeout = null;
                }, 100);
              }, { passive: true });

              // 2. Theme Logic
              const setTheme = (theme) => {
                const body = document.body;
                if (theme === 'dark') {
                  body.classList.add('quarto-dark');
                  body.classList.remove('quarto-light');
                } else {
                  body.classList.add('quarto-light');
                  body.classList.remove('quarto-dark');
                }
                
                localStorage.setItem('quarto-color-scheme', theme);
                updateToggleIcon(theme);
                updateGiscusTheme(theme);

                if (typeof gtag !== 'undefined') {
                  gtag('event', 'theme_change', { 'theme_mode': theme });
                }
              };

              const updateGiscusTheme = (theme) => {
                const giscusFrame = document.querySelector('iframe.giscus-frame');
                if (giscusFrame) {
                  const giscusTheme = theme === 'dark' ? 'dark' : 'light';
                  giscusFrame.contentWindow.postMessage(
                    { giscus: { setConfig: { theme: giscusTheme } } },
                    'https://giscus.app'
                  );
                }
              };

              const updateToggleIcon = (theme) => {
                const icon = document.querySelector('.theme-icon');
                if (icon) {
                  icon.textContent = theme === 'dark' ? '☀️' : '🌙';
                }
              };

              const theme = localStorage.getItem('quarto-color-scheme') || 
                            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
              setTheme(theme);

              document.addEventListener('DOMContentLoaded', () => {
                const toggle = document.getElementById('theme-toggle');
                if (toggle) {
                  toggle.addEventListener('click', () => {
                    const isDark = document.body.classList.contains('quarto-dark');
                    setTheme(isDark ? 'light' : 'dark');
                  });
                }
              });
            })();
          </script>

          <script>
            document.addEventListener('DOMContentLoaded', function() {
              const sendGAEvent = (name, params) => {
                if (typeof gtag !== 'undefined') gtag('event', name, params);
              };

              // CV Downloads
              document.querySelectorAll('a[href*="assets/docs/CV_Maykol_Medrano.pdf"]').forEach(link => {
                link.addEventListener('click', () => {
                  sendGAEvent('file_download', { 'file_name': 'assets/docs/CV_Maykol_Medrano.pdf', 'file_type': 'PDF' });
                });
              });

              // Software & Social Links
              document.querySelectorAll('a[href*="github.com"], a[href*="pypi.org"], a[href*="linkedin.com"]').forEach(link => {
                link.addEventListener('click', () => {
                  sendGAEvent('click_external', { 'destination_url': link.href });
                });
              });

              // Scroll Depth - Throttled for performance
              let scrollDepthTracked = {25: false, 50: false, 75: false, 100: false};
              let depthScrollTimeout;
              window.addEventListener('scroll', () => {
                if (depthScrollTimeout) return;
                depthScrollTimeout = setTimeout(() => {
                  const scrollPercent = (window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 100;
                  Object.keys(scrollDepthTracked).forEach(depth => {
                    if (scrollPercent >= depth && !scrollDepthTracked[depth]) {
                      scrollDepthTracked[depth] = true;
                      sendGAEvent('scroll_depth', { 'percent_scrolled': depth });
                    }
                  });
                  depthScrollTimeout = null;
                }, 200);
              }, { passive: true });
            });
          </script>

