          <!-- Dark Mode Toggle Button -->
          <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
            <span class="theme-icon">🌙</span>
          </button>

          <!-- Dark Mode Script -->
          <script>
            // Initialize theme from localStorage or system preference
            (function() {
              const getPreferredTheme = () => {
                const savedTheme = localStorage.getItem('theme');
                if (savedTheme) {
                  return savedTheme;
                }
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
              };

              const setTheme = (theme) => {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
                updateToggleIcon(theme);

                // Track theme change in GA4
                if (typeof gtag !== 'undefined') {
                  gtag('event', 'theme_change', {
                    'theme_mode': theme
                  });
                }
              };

              const updateToggleIcon = (theme) => {
                const icon = document.querySelector('.theme-icon');
                if (icon) {
                  icon.textContent = theme === 'dark' ? '☀️' : '🌙';
                }
              };

              // Set initial theme
              const theme = getPreferredTheme();
              setTheme(theme);

              // Toggle theme on button click
              document.addEventListener('DOMContentLoaded', () => {
                const toggle = document.getElementById('theme-toggle');
                if (toggle) {
                  toggle.addEventListener('click', () => {
                    const currentTheme = document.documentElement.getAttribute('data-theme');
                    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                    setTheme(newTheme);
                  });
                }
              });

              // Listen for system theme changes
              window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                if (!localStorage.getItem('theme')) {
                  setTheme(e.matches ? 'dark' : 'light');
                }
              });
            })();
          </script>

          <!-- Advanced Google Analytics Event Tracking -->
          <script>
            document.addEventListener('DOMContentLoaded', function() {
              // Helper function to send GA4 events
              function sendGAEvent(eventName, eventParams) {
                if (typeof gtag !== 'undefined') {
                  gtag('event', eventName, eventParams);
                }
              }

              // Track CV downloads
              const cvLinks = document.querySelectorAll('a[href*="CV_Maykol_Medrano.pdf"]');
              cvLinks.forEach(link => {
                link.addEventListener('click', () => {
                  sendGAEvent('file_download', {
                    'file_name': 'CV_Maykol_Medrano.pdf',
                    'file_type': 'PDF',
                    'link_text': link.textContent
                  });
                });
              });

              // Track external software package clicks
              const packageLinks = document.querySelectorAll('a[href*="pypi.org"], a[href*="github.com"]');
              packageLinks.forEach(link => {
                link.addEventListener('click', () => {
                  const url = new URL(link.href);
                  const isPyPI = url.hostname.includes('pypi.org');
                  const isGitHub = url.hostname.includes('github.com');

                  sendGAEvent('software_click', {
                    'platform': isPyPI ? 'PyPI' : isGitHub ? 'GitHub' : 'Other',
                    'package_url': link.href,
                    'link_text': link.textContent
                  });
                });
              });

              // Track project views
              const projectLinks = document.querySelectorAll('a[href*="projects/"]');
              projectLinks.forEach(link => {
                link.addEventListener('click', () => {
                  const projectName = link.href.split('/').pop().replace('.html', '');
                  sendGAEvent('project_view', {
                    'project_name': projectName,
                    'link_text': link.textContent
                  });
                });
              });

              // Track social media clicks
              const socialLinks = document.querySelectorAll('a[href*="linkedin.com"], a[href*="github.com"], a[href*="twitter.com"]');
              socialLinks.forEach(link => {
                link.addEventListener('click', () => {
                  const url = new URL(link.href);
                  const platform = url.hostname.includes('linkedin') ? 'LinkedIn' :
                                  url.hostname.includes('github') ? 'GitHub' :
                                  url.hostname.includes('twitter') ? 'Twitter' : 'Other';

                  sendGAEvent('social_click', {
                    'platform': platform,
                    'destination_url': link.href
                  });
                });
              });

              // Track email clicks
              const emailLinks = document.querySelectorAll('a[href^="mailto:"]');
              emailLinks.forEach(link => {
                link.addEventListener('click', () => {
                  sendGAEvent('email_click', {
                    'email_address': link.href.replace('mailto:', ''),
                    'link_text': link.textContent
                  });
                });
              });

              // Track scroll depth
              let scrollDepthTracked = {25: false, 50: false, 75: false, 100: false};
              window.addEventListener('scroll', () => {
                const scrollPercent = (window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 100;

                Object.keys(scrollDepthTracked).forEach(depth => {
                  if (scrollPercent >= depth && !scrollDepthTracked[depth]) {
                    scrollDepthTracked[depth] = true;
                    sendGAEvent('scroll_depth', {
                      'percent_scrolled': depth,
                      'page_path': window.location.pathname
                    });
                  }
                });
              });

              // Track time on page
              let startTime = Date.now();
              window.addEventListener('beforeunload', () => {
                const timeSpent = Math.round((Date.now() - startTime) / 1000);
                sendGAEvent('time_on_page', {
                  'page_path': window.location.pathname,
                  'time_seconds': timeSpent
                });
              });

              // Track search usage
              const searchInput = document.querySelector('#quarto-search input');
              if (searchInput) {
                searchInput.addEventListener('keyup', (e) => {
                  if (e.key === 'Enter' && searchInput.value) {
                    sendGAEvent('search', {
                      'search_term': searchInput.value
                    });
                  }
                });
              }

              // Track badge clicks (PyPI/GitHub badges)
              const badgeLinks = document.querySelectorAll('a img[src*="shields.io"]');
              badgeLinks.forEach(badge => {
                badge.parentElement.addEventListener('click', () => {
                  sendGAEvent('badge_click', {
                    'badge_type': badge.alt || 'unknown',
                    'destination_url': badge.parentElement.href
                  });
                });
              });
            });
          </script>